name: CI/CD workflow

on:
  push:
    branches:
      - main
      - 'sandbox/*'
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      sandbox:
        required: false
        type: boolean
        default: false

permissions:
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 26

      - uses: extractions/setup-just@v1

      - uses: pnpm/action-setup@v4

      - name: Build project
        run: just build

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          push: false

      - name: Archive production artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            ./dist
            !./dist/**/*.md

  cd-gh-pages:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.sandbox == false) || (github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip-cd]')) }}
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app

      - name: List artifact files
        run: ls

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload to pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cd-dockerhub:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip-cd]')) }}
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            vncsmyrnk/portfolio
            ghcr.io/vncsmyrnk/portfolio
          tags: |
            type=raw,value=prod,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=sandbox,enable=${{ inputs.sandbox == true || startsWith(github.ref_name, 'sandbox/') }}

      - name: Build and push
        uses: docker/build-push-action@v5
        id: build
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # https://github.com/google-github-actions/example-workflows/blob/main/workflows/deploy-cloudrun/cloudrun-docker.yml
  cd-cloudrun-prod:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.sandbox == false) || (github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip-cd]')) }}
    runs-on: ubuntu-latest
    needs: cd-dockerhub
    environment:
      name: cloud-run
      url: https://vncsmyrnk.dev
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v3'
        with:
          project_id: ${{ secrets.PROJECT_ID }}
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.SERVICE }}
          region: ${{ vars.REGION }}
          image: vncsmyrnk/portfolio@${{ needs.cd-dockerhub.outputs.digest }}

  cd-cloudrun-sandbox:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.sandbox == true) || startsWith(github.ref_name, 'sandbox/') }}
    runs-on: ubuntu-latest
    needs: cd-dockerhub
    environment:
      name: cloud-run-sandbox
      url: https://sandbox.vncsmyrnk.dev
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v3'
        with:
          project_id: ${{ secrets.PROJECT_ID }}
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.SERVICE }}
          region: ${{ vars.REGION }}
          image: vncsmyrnk/portfolio@${{ needs.cd-dockerhub.outputs.digest }}

  cd-cache-prod:
    runs-on: ubuntu-latest
    needs: cd-cloudrun-prod
    steps:
        - name: Purges cloudflare cache
          env:
            CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
            CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          run: |
            curl -X POST \
              "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
              -H 'content-type: application/json' \
              -H "Authorization: bearer $CLOUDFLARE_API_KEY" \
              -d '{"hosts": ["vncsmyrnk.dev"]}' \
              --fail

  cd-cache-sandbox:
    runs-on: ubuntu-latest
    needs: cd-cloudrun-sandbox
    steps:
        - name: Purges cloudflare cache
          env:
            CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
            CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          run: |
            curl -X POST \
              "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
              -H 'content-type: application/json' \
              -H "Authorization: bearer $CLOUDFLARE_API_KEY" \
              -d '{"hosts": ["sandbox.vncsmyrnk.dev"]}' \
              --fail

  cd-koyeb:
    # if: github.ref == 'refs/heads/main'
    if: false
    runs-on: ubuntu-latest
    environment:
      name: koyeb
      url: ${{ vars.URL }}
    needs: cd-dockerhub
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: extractions/setup-just@v1

      - name: Deploy
        env:
          TOKEN: ${{ secrets.KOYEB_TOKEN }}
          SERVICEID: ${{ secrets.KOYEB_SERVICEID }}
        run: KOYEB_TOKEN=$TOKEN KOYEB_SERVICEID=$SERVICEID just deploy-to-koyeb
